<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>¡Limpia, limpia!</title>

  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ÚNICAMENTE ESTILOS PARA PANTALLA COMPLETA Y PAUSA */
    .top-ui-btn {
      position: fixed;
      top: 12px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.35);
      color: rgba(255, 255, 255, 0.85);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0.6;
      backdrop-filter: blur(2px);
      transition: opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .top-ui-btn:active {
      opacity: 1;
      background: rgba(255, 255, 255, 0.25);
    }

    #btn-fullscreen {
      left: 12px;
    }

    #btn-pause {
      right: 12px;
    }

    /* MODAL OVERLAY DE PAUSA */
    #pause-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      backdrop-filter: blur(6px);
      font-family: sans-serif;
    }

    #pause-overlay.hidden {
      display: none !important;
    }

    .pause-card {
      background: rgba(30, 30, 30, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      min-width: 280px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .pause-card h2 {
      color: #fff;
      margin-top: 0;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .modal-btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      margin: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .modal-btn:active {
      transform: scale(0.96);
    }

    .modal-btn.primary {
      background: #e63946;
      border: none;
    }
  </style>
</head>
<body>

  <!-- BOTONES DE PANTALLA COMPLETA Y PAUSA -->
  <button id="btn-fullscreen" class="top-ui-btn" title="Pantalla Completa">⛶</button>
  <button id="btn-pause" class="top-ui-btn" title="Pausar Juego">⏸</button>

  <!-- MODAL / MENÚ DE PAUSA -->
  <div id="pause-overlay" class="hidden">
    <div class="pause-card">
      <h2>PAUSA</h2>
      <button id="btn-resume" class="modal-btn primary">Reanudar</button>
      <button id="btn-menu" class="modal-btn">Menú Principal</button>
    </div>
  </div>

  <div id="gameWrapper">

    <canvas id="gameCanvas"></canvas>

    <div id="touchControls">

        <div id="leftControls">
            <button id="btnLeft">◀</button>
            <button id="btnRight">▶</button>
        </div>

        <div id="rightControls">
            <button id="btnAction">✋</button>
            <button id="btnJump">⬆</button>
        </div>

    </div>

  </div>

  <script>
    // 1. PANTALLA COMPLETA
    document.getElementById("btn-fullscreen").addEventListener("click", () => {
      const doc = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (doc.requestFullscreen) doc.requestFullscreen();
        else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });

    // 2. SISTEMA DE PAUSA Y CONTROL DE MÚSICA
    const pauseOverlay = document.getElementById("pause-overlay");
    const btnPause = document.getElementById("btn-pause");
    const btnResume = document.getElementById("btn-resume");
    const btnMenu = document.getElementById("btn-menu");

    function setPause(isPaused) {
      if (isPaused) {
        pauseOverlay.classList.remove("hidden");
        // Pausa todos los elementos de audio HTML activos
        document.querySelectorAll("audio").forEach(audio => audio.pause());
      } else {
        pauseOverlay.classList.add("hidden");
        // Reanuda la reproducción de audio HTML
        document.querySelectorAll("audio").forEach(audio => audio.play().catch(() => {}));
      }

      // Notifica a main.js para pausar el motor de físicas, bucles y Web Audio API
      window.dispatchEvent(new CustomEvent("togglePause", { detail: { isPaused } }));
    }

    btnPause.addEventListener("click", () => setPause(true));
    btnResume.addEventListener("click", () => setPause(false));

    btnMenu.addEventListener("click", () => {
      window.location.href = "../index.html";
    });
  </script>

  <script type="module" src="main.js"></script>

</body>
</html>
