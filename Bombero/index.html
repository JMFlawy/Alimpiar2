<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bomberos al Rescate</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* BOTÓN PANTALLA COMPLETA BASE (ARRIBA A LA IZQUIERDA) */
    #btn-fullscreen {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      -webkit-tap-highlight-color: transparent;
    }

    /* 1. MODO HORIZONTAL (LANDSCAPE): TAMAÑO NORMAL EN LA IZQUIERDA */
    @media (orientation: landscape) {
      #btn-fullscreen {
        width: 44px !important;
        height: 44px !important;
        font-size: 1.2rem !important;
        top: 12px !important;
        left: 12px !important;
        right: auto !important;
      }

      .touch-controls, .virtual-dpad, .touch-btn {
        transform: scale(1) !important;
      }
    }

    /* 2. MODO VERTICAL (PORTRAIT): MÁS GRANDE EN LA IZQUIERDA */
    @media (orientation: portrait) {
      #btn-fullscreen {
        width: 58px !important;
        height: 58px !important;
        font-size: 1.6rem !important;
        top: 16px !important;
        left: 16px !important;
        right: auto !important;
      }

      .touch-controls, .virtual-dpad, .touch-btn {
        transform: scale(1.35) !important;
        transform-origin: bottom left;
      }
    }
  </style>
</head>
<body>

  <button id="btn-fullscreen" title="Pantalla Completa">⛶</button>

  <canvas id="gameCanvas"></canvas>

  <script>
    document.getElementById("btn-fullscreen").addEventListener("click", () => {
      const doc = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (doc.requestFullscreen) doc.requestFullscreen();
        else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });
  </script>

  <script type="module" src="main.js"></script>
</body>
</html>
