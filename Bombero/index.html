<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Bomberos al Rescate</title>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      cursor: crosshair;
    }

    .fullscreen-button {
      position: fixed;
      z-index: 10000;
      right: calc(15px + var(--safe-right, 0px));
      bottom: calc(15px + var(--safe-bottom));
      min-width: 48px;
      min-height: 48px;
      padding: 10px 14px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      background: rgba(20, 20, 20, 0.75);
      color: #fff;
      font: bold 14px Arial, sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      backdrop-filter: blur(4px);
    }

    .fullscreen-button:active {
      transform: scale(0.94);
    }

    @media (orientation: portrait) and (max-width: 700px) {
      .fullscreen-button {
        right: 12px;
        bottom: calc(12px + var(--safe-bottom));
        min-width: 56px;
        min-height: 56px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <button
    id="fullscreenButton"
    class="fullscreen-button"
    type="button"
    aria-label="Activar pantalla completa"
  >
    ⛶
  </button>

  <script type="module" src="main.js"></script>

  <script>
    const fullscreenButton = document.getElementById("fullscreenButton");

    fullscreenButton.addEventListener("click", async (event) => {
      event.preventDefault();
      event.stopPropagation();

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen({
            navigationUI: "hide"
          });

          if (screen.orientation?.lock) {
            try {
              await screen.orientation.lock("landscape");
            } catch {
              // Algunos navegadores no permiten bloquear la orientación.
            }
          }
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.warn("No se pudo activar pantalla completa:", error);
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent = document.fullscreenElement ? "×" : "⛶";
      fullscreenButton.setAttribute(
        "aria-label",
        document.fullscreenElement
          ? "Salir de pantalla completa"
          : "Activar pantalla completa"
      );
    });
  </script>

</body>
</html>
